<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synonymity</title>
<meta name="description" content="Look up a word for synonyms, or paste a sentence and get it rephrased.">
<meta name="theme-color" content="#0b0b12">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M44 20c-3-4-8-6-13-6-7 0-12 3-12 9 0 14 22 7 22 19 0 6-6 9-13 9-6 0-11-3-14-7' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='14' r='4' fill='white' opacity='.85'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b12; --bg2:#12121c; --card:#161624; --card2:#1c1c2e;
  --line:#2a2a40; --text:#ecebf5; --muted:#9a98b5;
  --a:#8b5cf6; --b:#22d3ee; --good:#34d399; --bad:#fb7185;
  --grad:linear-gradient(135deg,var(--a),var(--b));
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(900px 500px at 12% -10%,rgba(139,92,246,.22),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(34,211,238,.14),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  min-height:100vh;
}
main{max-width:820px;margin:0 auto;padding:48px 16px 80px}
header{text-align:center;margin-bottom:32px}
.logo{
  width:60px;height:60px;border-radius:16px;background:var(--grad);display:grid;place-items:center;
  margin:0 auto 14px;box-shadow:0 10px 40px rgba(139,92,246,.45);
}
.logo svg{width:34px;height:34px}
h1{font-size:clamp(2rem,6vw,2.9rem);margin:0;letter-spacing:-.03em;line-height:1.1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);margin:8px 0 0}

.box{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);transition:border-color .2s, box-shadow .2s;
}
.box:focus-within{border-color:var(--a);box-shadow:0 0 0 4px rgba(139,92,246,.18),0 20px 50px rgba(0,0,0,.35)}
textarea{
  width:100%;background:transparent;border:0;outline:0;resize:none;color:var(--text);
  font:inherit;font-size:1.15rem;min-height:56px;max-height:260px;padding:6px 8px;
}
textarea::placeholder{color:#6d6b88}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.mode{font-size:.85rem;color:var(--muted);padding-left:8px}
.mode b{color:var(--b);font-weight:600}
button{font:inherit;cursor:pointer}
.go{
  border:0;color:#0b0b12;font-weight:700;padding:10px 22px;border-radius:12px;background:var(--grad);
  transition:transform .15s, filter .15s;
}
.go:hover{filter:brightness(1.1);transform:translateY(-1px)}
.go:active{transform:none}
.go:disabled{opacity:.5;cursor:wait}
.examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.ex{
  background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 13px;font-size:.85rem;
  transition:.15s;
}
.ex:hover{color:var(--text);border-color:var(--a)}

#out{margin-top:28px}
.status{text-align:center;color:var(--muted);padding:30px 0}
.status.err{color:var(--bad)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--b);border-radius:50%;
  animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--bg2);padding:5px;border-radius:12px;border:1px solid var(--line);width:fit-content}
.tab{background:transparent;border:0;color:var(--muted);padding:7px 16px;border-radius:8px;font-size:.92rem}
.tab.on{background:var(--card2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.group{margin-bottom:22px}
.group h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 14px;
  transition:.15s;animation:pop .3s both;
}
.chip:hover{border-color:var(--b);background:var(--card2);transform:translateY(-1px)}
.chip.copied{border-color:var(--good);color:var(--good)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}

.result{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
  font-size:1.25rem;line-height:1.8;
}
.w{border-radius:6px;padding:1px 3px;margin:0 -1px;cursor:pointer;
  background:rgba(139,92,246,.18);border-bottom:2px solid var(--a);transition:.15s}
.w:hover{background:rgba(34,211,238,.2);border-color:var(--b)}
.w.open{background:rgba(34,211,238,.25);border-color:var(--b)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:10px;transition:.15s}
.ghost:hover{border-color:var(--a)}
.ghost.copied{border-color:var(--good);color:var(--good)}
.slider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;margin-left:auto}
input[type=range]{accent-color:var(--a);width:130px}
.orig{margin-top:18px;color:var(--muted);font-size:.92rem}
.orig span{display:block;color:#bdbbd6;margin-top:2px}

.pop{
  position:absolute;z-index:10;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;min-width:150px;max-width:260px;max-height:280px;overflow:auto;
}
.pop button{background:transparent;border:0;color:var(--text);text-align:left;padding:6px 10px;border-radius:7px}
.pop button:hover{background:rgba(139,92,246,.25)}
.pop button.cur{color:var(--b)}
.pop small{color:var(--muted);padding:2px 10px 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}
footer{text-align:center;color:#6d6b88;font-size:.8rem;margin-top:60px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M44 20c-3-4-8-6-13-6-7 0-12 3-12 9 0 14 22 7 22 19 0 6-6 9-13 9-6 0-11-3-14-7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
    </div>
    <h1>Synonymity</h1>
    <p class="tag">Find the right word. Or say the whole thing differently.</p>
  </header>

  <form class="box" id="form">
    <textarea id="q" rows="1" placeholder="Type a word or paste a sentence…" autofocus spellcheck="false" aria-label="Word or sentence"></textarea>
    <div class="bar">
      <span class="mode" id="mode">Mode: <b>word lookup</b></span>
      <button class="go" id="go" type="submit">Look up</button>
    </div>
  </form>

  <div class="examples" id="examples">
    <button class="ex" type="button">happy</button>
    <button class="ex" type="button">ubiquitous</button>
    <button class="ex" type="button">The quick brown fox jumps over the lazy dog</button>
    <button class="ex" type="button">I was really tired after the long and difficult meeting</button>
  </div>

  <section id="out" aria-live="polite"></section>
  <footer>Synonymity · powered by <a href="https://www.datamuse.com/api/" target="_blank" rel="noopener">Datamuse</a></footer>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const q = $('#q'), out = $('#out'), go = $('#go'), modeEl = $('#mode');
  const API = 'https://api.datamuse.com/words';
  const cache = new Map();

  const STOP = new Set(('a an the and or but nor so yet for of in on at to from by with about into over under after before between through during without within as is are was were be been being am do does did done have has had having will would shall should can could may might must not no this that these those it its he him his she her hers they them their theirs we us our ours you your yours i me my mine who whom whose which what when where why how than then there here if because while also just very too up down out off again further once all any both each few more most other some such only own same s t don now said say says').split(/\s+/));

  /* ---------- API ---------- */
  async function dm(params) {
    const url = API + '?' + new URLSearchParams(params);
    if (cache.has(url)) return cache.get(url);
    const p = fetch(url).then(r => { if (!r.ok) throw new Error('Lookup failed (' + r.status + ')'); return r.json(); });
    cache.set(url, p);
    try { return await p; } catch (e) { cache.delete(url); throw e; }
  }
  const POS = { n: 'Nouns', v: 'Verbs', adj: 'Adjectives', adv: 'Adverbs', u: 'Other' };
  const posOf = w => (w.tags || []).find(t => POS[t] && t !== 'u') || 'u';
  const syns = (w, extra = {}) => dm({ rel_syn: w, md: 'p', max: 40, ...extra });

  /* ---------- input handling ---------- */
  const isSentence = s => s.trim().split(/\s+/).length > 1;
  const autosize = () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 260) + 'px'; };
  function syncMode() {
    const sent = isSentence(q.value);
    modeEl.innerHTML = 'Mode: <b>' + (sent ? 'rephrase sentence' : 'word lookup') + '</b>';
    go.textContent = sent ? 'Rephrase' : 'Look up';
  }
  q.addEventListener('input', () => { autosize(); syncMode(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); } });
  $('#form').addEventListener('submit', e => { e.preventDefault(); run(); });
  $('#examples').addEventListener('click', e => {
    if (e.target.classList.contains('ex')) { q.value = e.target.textContent; autosize(); syncMode(); run(); }
  });

  async function run() {
    closePop();
    const text = q.value.trim();
    if (!text) { out.innerHTML = ''; return; }
    go.disabled = true;
    out.innerHTML = '<div class="status"><span class="spin"></span>Thinking…</div>';
    try {
      isSentence(text) ? await rephrase(text) : await lookup(text);
    } catch (err) {
      out.innerHTML = '<div class="status err">' + esc(err.message || 'Something went wrong') + '. Check your connection and try again.</div>';
    }
    go.disabled = false;
  }
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function copy(text, el) {
    try { await navigator.clipboard.writeText(text); } catch (e) { return; }
    el.classList.add('copied');
    const old = el.textContent;
    if (el.classList.contains('chip')) el.textContent = 'Copied';
    setTimeout(() => { el.classList.remove('copied'); el.textContent = old; }, 900);
  }

  /* ---------- single word ---------- */
  const TABS = [
    ['syn', 'Synonyms', w => dm({ rel_syn: w, md: 'p', max: 60 })],
    ['ant', 'Antonyms', w => dm({ rel_ant: w, md: 'p', max: 40 })],
    ['rel', 'Similar', w => dm({ ml: w, md: 'p', max: 60 })],
  ];
  async function lookup(word, tab = 0) {
    word = word.trim().toLowerCase();
    const [, label, fn] = TABS[tab];
    let list = (await fn(word)).filter(x => x.word.toLowerCase() !== word);
    let html = '<div class="tabs" role="tablist">' + TABS.map((t, i) =>
      `<button class="tab${i === tab ? ' on' : ''}" data-tab="${i}" role="tab">${t[1]}</button>`).join('') + '</div>';
    if (!list.length) {
      html += `<div class="status">No ${label.toLowerCase()} found for “${esc(word)}”. Check the spelling?</div>`;
    } else {
      const groups = {};
      list.forEach(w => (groups[posOf(w)] = groups[posOf(w)] || []).push(w.word));
      let i = 0;
      html += Object.keys(POS).filter(k => groups[k]).map(k =>
        `<div class="group"><h3>${POS[k]}</h3><div class="chips">` +
        groups[k].map(w => `<button class="chip" style="animation-delay:${Math.min(i++ * 15, 400)}ms" data-w="${esc(w)}">${esc(w)}</button>`).join('') +
        '</div></div>').join('');
      html += '<p class="hint">Tap a word to copy it · double-click to look it up</p>';
    }
    out.innerHTML = html;
    out.querySelectorAll('.tab').forEach(b => b.onclick = () => lookup(word, +b.dataset.tab));
    out.querySelectorAll('.chip').forEach(b => {
      b.onclick = () => copy(b.dataset.w, b);
      b.ondblclick = () => { q.value = b.dataset.w; autosize(); syncMode(); lookup(b.dataset.w); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    });
  }

  /* ---------- inflection helpers ---------- */
  const V = /[aeiou]/;
  const cvc = w => /[^aeiou][aeiou][^aeiouwxy]$/.test(w) && w.length <= 4;
  function inflect(base, form) {
    if (form === 'ing') {
      if (/ie$/.test(base)) return base.slice(0, -2) + 'ying';
      if (/[^e]e$/.test(base)) return base.slice(0, -1) + 'ing';
      return (cvc(base) ? base + base.slice(-1) : base) + 'ing';
    }
    if (form === 'ed') {
      if (/e$/.test(base)) return base + 'd';
      if (/[^aeiou]y$/.test(base)) return base.slice(0, -1) + 'ied';
      return (cvc(base) ? base + base.slice(-1) : base) + 'ed';
    }
    if (form === 's') {
      if (/(s|x|z|ch|sh)$/.test(base)) return base + 'es';
      if (/[^aeiou]y$/.test(base)) return base.slice(0, -1) + 'ies';
      return base + 's';
    }
    return base;
  }
  // Guess possible base forms for an inflected word
  function bases(w) {
    const c = [];
    if (w.length > 5 && w.endsWith('ing')) {
      const s = w.slice(0, -3);
      c.push({ b: s + 'e', f: 'ing' }, { b: s, f: 'ing' });
      if (/(.)\1$/.test(s)) c.push({ b: s.slice(0, -1), f: 'ing' });
    } else if (w.length > 4 && w.endsWith('ied')) {
      c.push({ b: w.slice(0, -3) + 'y', f: 'ed' });
    } else if (w.length > 4 && w.endsWith('ed')) {
      const s = w.slice(0, -2);
      c.push({ b: s, f: 'ed' }, { b: s + 'e', f: 'ed' });
      if (/(.)\1$/.test(s)) c.push({ b: s.slice(0, -1), f: 'ed' });
    } else if (w.length > 4 && w.endsWith('ies')) {
      c.push({ b: w.slice(0, -3) + 'y', f: 's' });
    } else if (w.length > 3 && w.endsWith('s') && !/(ss|us|is)$/.test(w)) {
      c.push({ b: w.endsWith('es') ? w.slice(0, -2) : w.slice(0, -1), f: 's' });
      if (w.endsWith('es')) c.push({ b: w.slice(0, -1), f: 's' });
    }
    c.push({ b: w, f: '' });
    return c;
  }

  /* ---------- sentence rephrase ---------- */
  let state = null;

  async function rephrase(text) {
    const parts = text.match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g) || [];
    const toks = parts.map((t, i) => ({ t, i, word: /^[A-Za-z]/.test(t) }));
    let sentStart = true;
    toks.forEach((k, idx) => {
      if (!k.word) { if (/[.!?]/.test(k.t)) sentStart = true; return; }
      const lw = k.t.toLowerCase();
      const proper = !sentStart && /^[A-Z][a-z]/.test(k.t);
      k.sentStart = sentStart;
      k.eligible = lw.length > 3 && !STOP.has(lw) && !proper && !k.t.includes("'");
      k.prev = idx;
      sentStart = false;
    });

    await Promise.all(toks.filter(k => k.eligible).map(async k => {
      const lw = k.t.toLowerCase();
      for (const { b, f } of bases(lw)) {
        let list;
        try { list = await syns(b); } catch (e) { throw e; }
        list = list.filter(x => /^[a-z]+$/.test(x.word) && x.word !== b);
        if (!list.length) continue;
        // POS of the original: use the first synonym-bearing sense; prefer matching candidates
        const wantVerb = f === 'ing' || f === 'ed';
        let cands = list.filter(x => !wantVerb || (x.tags || []).includes('v'));
        if (f === 's') cands = list.filter(x => (x.tags || []).some(t => t === 'n' || t === 'v'));
        if (!cands.length) continue;
        k.alts = [...new Set(cands.slice(0, 12).map(x => inflect(x.word, f)))];
        break;
      }
      if (!k.alts || !k.alts.length) k.eligible = false;
    }));

    state = { toks, intensity: 0.75, shuffleSeed: 0, text };
    toks.forEach(k => { if (k.eligible) { k.r = Math.random(); k.pick = Math.floor(Math.random() * Math.min(3, k.alts.length)); k.manual = null; } });
    renderSentence();
  }

  function chosen(k) {
    if (!k.eligible) return null;
    if (k.manual !== null) return k.manual === -1 ? null : k.alts[k.manual];
    return k.r < state.intensity ? k.alts[k.pick] : null;
  }
  function matchCase(orig, w) {
    if (orig === orig.toUpperCase() && orig.length > 1) return w.toUpperCase();
    if (/^[A-Z]/.test(orig)) return w[0].toUpperCase() + w.slice(1);
    return w;
  }
  function buildPieces() {
    const pieces = state.toks.map(k => {
      const c = chosen(k);
      return { k, text: c ? matchCase(k.t, c) : k.t, changed: !!c };
    });
    // a / an agreement
    for (let i = 0; i < pieces.length; i++) {
      const p = pieces[i];
      if (!p.k.word || !/^an?$/i.test(p.k.t)) continue;
      const next = pieces.slice(i + 1).find(x => x.k.word);
      if (!next) continue;
      const vowel = /^(a|e|i|o|u)/i.test(next.text) && !/^(uni|use|usu|eu|one)/i.test(next.text) || /^(hour|honest|heir)/i.test(next.text);
      const art = vowel ? 'an' : 'a';
      p.text = matchCase(p.k.t, art);
    }
    return pieces;
  }
  function renderSentence() {
    const pieces = buildPieces();
    const html = pieces.map((p, i) => p.k.eligible
      ? `<span class="w" data-i="${i}" title="Click for alternatives">${esc(p.text)}</span>`
      : esc(p.text)).join('');
    const plain = pieces.map(p => p.text).join('');
    const count = pieces.filter(p => p.changed).length;
    out.innerHTML = `
      <div class="result" id="res">${html}</div>
      <div class="ctrl">
        <button class="ghost" id="shuf">↻ Rephrase again</button>
        <button class="ghost" id="cp">Copy</button>
        <label class="slider">Change more
          <input type="range" id="int" min="0" max="100" value="${Math.round(state.intensity * 100)}"></label>
      </div>
      <p class="hint">${count ? count + ' word' + (count > 1 ? 's' : '') + ' swapped. Click any highlighted word to choose a different one.' : 'No swappable words found — try a longer sentence or nudge the slider.'}</p>
      <div class="orig">Original<span>${esc(state.text)}</span></div>`;
    $('#cp').onclick = e => copy(plain, e.currentTarget);
    $('#shuf').onclick = () => {
      state.toks.forEach(k => { if (k.eligible) { k.r = Math.random(); k.pick = Math.floor(Math.random() * Math.min(5, k.alts.length)); k.manual = null; } });
      renderSentence();
    };
    $('#int').oninput = e => { state.intensity = e.target.value / 100; renderSentence(); $('#int').focus(); };
    out.querySelectorAll('.w').forEach(el => el.onclick = ev => { ev.stopPropagation(); openPop(el, pieces[+el.dataset.i].k); });
  }

  /* ---------- word picker popover ---------- */
  let pop = null;
  function closePop() { if (pop) { pop.remove(); pop = null; } document.querySelectorAll('.w.open').forEach(e => e.classList.remove('open')); }
  function openPop(el, k) {
    const same = pop && pop.dataset.for === String(k.i);
    closePop();
    if (same) return;
    el.classList.add('open');
    pop = document.createElement('div');
    pop.className = 'pop';
    pop.dataset.for = k.i;
    const cur = chosen(k);
    const opts = [['__orig', k.t, cur === null]].concat(k.alts.map((a, i) => [i, matchCase(k.t, a), a === cur]));
    pop.innerHTML = '<small>Choose</small>' + opts.map(([v, t, on]) =>
      `<button data-v="${v}" class="${on ? 'cur' : ''}">${esc(t)}${v === '__orig' ? ' (original)' : ''}</button>`).join('');
    document.body.appendChild(pop);
    const r = el.getBoundingClientRect();
    const left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8));
    pop.style.left = left + 'px';
    pop.style.top = (r.bottom + scrollY + 6) + 'px';
    pop.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      k.manual = b.dataset.v === '__orig' ? -1 : +b.dataset.v;
      closePop(); renderSentence();
    };
  }
  document.addEventListener('click', e => { if (pop && !pop.contains(e.target)) closePop(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

  syncMode();
})();
</script>
</body>
</html>
